name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build unsigned
        run: ./scripts/build-unsigned.sh
      - name: Test
        run: ./scripts/test.sh
