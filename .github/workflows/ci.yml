name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify terminal orchestration contracts
        run: python3 scripts/test-cmux-maestro-orchestrator.py
      - name: Verify managed messaging and legacy proof launcher contracts
        run: python3 scripts/test-delivery-proof.py
      - name: Verify native delivery adapter contracts
        run: node --test scripts/test-delivery-proof.mjs
      - name: Verify build and registration metadata contracts
        run: python3 scripts/test-build-metadata.py
      - name: Verify local preview transactions and recovery
        run: python3 scripts/test-local-preview.py
      - name: Verify SDK fetch concurrency and cleanup
        run: ./scripts/test-fetch-sdk-concurrency.sh
      - name: Build isolated validation targets
        run: ./scripts/build-unsigned.sh
      - name: Run integrated Swift tests
        run: ./scripts/test.sh
      - name: Upload synthetic sidebar layout renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-layout-offscreen
          path: .build/layout-validation/offscreen/*.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Verify Settings guide and setup process isolation
        run: ./scripts/test-copilot-setup.sh
      - name: Verify compiled hooks fail open
        run: ./scripts/test-copilot-hook.sh
      - name: Verify shared file traversal under narrow sandbox grants
        run: ./scripts/test-copilot-sandbox.sh
      - name: Upload integrated test scope evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-test-scope-evidence
          path: |
            .build/tests/scoped-results/**/*.json
            .build/tests/scoped-results/**/*.txt
            .build/tests/scoped-results/**/guide-acceptance/*.log
            .build/tests/scoped-results/**/guide-acceptance/probe.xcresult
            .build/tests/scoped-results/**/guide-acceptance/images/*.png
            .build/setup-tests/metadata-watchdog/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  guide-ui-consumer-probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify additive UI probe contracts
        run: python3 scripts/test-guide-ui-validation.py
      - name: Fetch pinned project SDK
        run: ./scripts/fetch-sdk.sh
      - name: Probe public UI consumer with synthetic host
        run: ./scripts/test-guide-ui-validation.sh
      - name: Upload separate public UI probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-ui-consumer-probe
          path: |
            .build/guide-ui-validation/run-*/evidence.json
            .build/guide-ui-validation/run-*/*.log
            .build/guide-ui-validation/run-*/probe.xcresult
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
